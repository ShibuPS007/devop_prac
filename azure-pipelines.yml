trigger:
- main

pool:
  name: Linux-Build-Agents

steps:
- checkout: self

- script: |
    sudo apt-get update
    sudo apt-get install -y python3 python3-pip python3-venv

    python3 --version
    python3 -m pip install --upgrade pip
    python3 -m pip install -r requirement.txt
  displayName: Install Dependencies

- script: |
    python3 -c "import main; print('FastAPI app imported successfully')"
  displayName: Verify FastAPI App

- script: |
    echo "Running on VMSS agent"
    hostname
  displayName: Show Agent