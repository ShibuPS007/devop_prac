trigger:
- main

pool:
  name: Linux-Build-Agents   # Replace with your actual pool name

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'

- script: |
    pip install --upgrade pip
    pip install -r requirements.txt
  displayName: Install Dependencies

- script: |
    python -c "import main; print('FastAPI app imported successfully')"
  displayName: Verify FastAPI App

- script: |
    echo "Running on VMSS agent"
    hostname
  displayName: Show Agent