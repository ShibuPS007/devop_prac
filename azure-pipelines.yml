trigger:
- main

pool:
  name: Linux-Build-Agents   # Replace with your pool name

steps:
- checkout: self

- script: |
    sudo apt-get update
    sudo apt-get install -y python3 python3-pip python3-venv

    python3 -m venv venv
    source venv/bin/activate

    pip install --upgrade pip
    pip install -r requirements.txt

    python -c "import main; print('FastAPI app imported successfully')"

  displayName: "Install Dependencies and Verify App"