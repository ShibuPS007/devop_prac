trigger:
- main

pool:
  name: Linux-Build-Agents

steps:
- checkout: self

- script: |
    sudo apt-get update
    sudo apt-get install -y python3 python3-pip python3-venv

    python3 -m venv venv
    source venv/bin/activate

    pip install --upgrade pip
    pip install -r requirement.txt
  displayName: Install Dependencies

- script: |
    source venv/bin/activate
    python -c "import main; print('FastAPI app imported successfully')"
  displayName: Verify FastAPI App

- script: |
    echo "Running on VMSS agent"
    hostname
  displayName: Show Agent